name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (auto, patch, minor, major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Resolve and bump version
        id: package
        env:
          INPUT_BUMP: ${{ github.event.inputs.bump || 'auto' }}
        shell: bash
        run: |
          package_name=$(node -p "require('./package.json').name")
          current_version=$(node -p "require('./package.json').version")
          bumped=false

          echo "Current package: ${package_name}@${current_version}"
          echo "Requested bump mode: ${INPUT_BUMP}"

          if [ "$INPUT_BUMP" != "auto" ] && [ -n "$INPUT_BUMP" ]; then
            echo "Performing manual ${INPUT_BUMP} bump..."
            npm version "$INPUT_BUMP" --no-git-tag-version
            bumped=true
          elif npm view "${package_name}@${current_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${current_version} is already published on npm."
            echo "Auto-bumping patch version to avoid version collision..."
            npm version patch --no-git-tag-version
            bumped=true
          else
            echo "Version ${current_version} is not yet published on npm. Using specified version."
          fi

          final_version=$(node -p "require('./package.json').version")
          echo "Target publish version: ${final_version}"

          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${final_version}" >> "$GITHUB_OUTPUT"
          echo "bumped=${bumped}" >> "$GITHUB_OUTPUT"

      - name: Build universal native helper
        run: npm run build:release

      - name: Run tests
        run: npm test

      - name: Publish package
        run: npm publish

      - name: Commit version bump
        if: steps.package.outputs.bumped == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${PACKAGE_VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          tag="v${PACKAGE_VERSION}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists."
            exit 0
          fi

          release_args=(
            "$tag"
            --title "${PACKAGE_NAME} ${PACKAGE_VERSION}"
            --generate-notes
            --latest
          )

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "main")
          fi

          gh release create "${release_args[@]}"
