[workspace]
members = ["crates/useui-protocol", "crates/useui-client", "crates/useui-host"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "io-std", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
rmcp = { version = "=3.10.0", features = ["server", "transport-io"] }
